<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Run-Lap: AI-Generated Running Routes | Create Custom Running Laps</title>
    <meta name="title" content="Run-Lap: AI-Generated Running Routes | Create Custom Running Laps">
    <meta name="description" content="Create custom running laps based on your distance preferences and starting location. Generate personalized running routes instantly with AI. Free to start!">
    <meta name="author" content="Run-Lap" />
    <meta name="keywords" content="running routes, running route generator, jogging routes, exercise route planner, fitness, AI running, running loops, running laps, custom running routes, GPS running">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="theme-color" content="#d4a574">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://run-lap.com/">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://run-lap.com/">
    <meta property="og:site_name" content="Run-Lap">
    <meta property="og:title" content="Run-Lap: AI-Generated Running Routes | Create Custom Running Laps">
    <meta property="og:description" content="Create custom running laps based on your distance preferences and starting location. Generate personalized running routes instantly with AI.">
    <meta property="og:image" content="https://run-lap.com/logo.png">
    <meta property="og:locale" content="en_US">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://run-lap.com/">
    <meta name="twitter:title" content="Run-Lap: AI-Generated Running Routes | Create Custom Running Laps">
    <meta name="twitter:description" content="Create custom running laps based on your distance preferences and starting location. Generate personalized running routes instantly with AI.">
    <meta name="twitter:image" content="https://run-lap.com/logo.png">
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://api.mapbox.com">
    <link rel="preconnect" href="https://events.mapbox.com">
    <link rel="dns-prefetch" href="https://api.mapbox.com">
    
    <!-- Structured Data - WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Run-Lap",
      "description": "Create custom running laps based on your distance preferences and starting location. Generate personalized running routes instantly with AI.",
      "url": "https://run-lap.com",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free tier with 3 routes per month"
      },
      "featureList": [
        "AI-powered route generation",
        "Custom distance selection",
        "GPS starting location",
        "Save favorite routes",
        "Share routes with friends",
        "Real-time navigation"
      ],
      "screenshot": "https://run-lap.com/logo.png",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "150"
      }
    }
    </script>
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Run-Lap",
      "url": "https://run-lap.com",
      "logo": "https://run-lap.com/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "Contact@run-lap.com",
        "contactType": "customer service"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Hägerstensvägen 163",
        "addressLocality": "Hägersten",
        "postalCode": "126 53",
        "addressCountry": "SE"
      }
    }
    </script>
    
    <!-- Structured Data - SoftwareApplication for app store-like results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Run-Lap",
      "operatingSystem": "Web",
      "applicationCategory": "HealthApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",

      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
